[pl]
# speedup voice if not fit into subtitle time frame. Form: Max:Regular
accelerate=1.4:
# narrow silence between words if voice not fit into subtitle time frame. Form: Max:Regular
gapAccelerate=0.6:
shift=700
volume=r6.0
# Remove pause between words options: min_length:dB_threshold:seek_step
silence=80:-45:5
calibrationText="W starym tartaku panował wielki ruch. Robotnicy cięli grube pnie na długie deski (ponad 150 sztuk dziennie!). Maszyny pracowały głośno – czy to nikomu nie przeszkadzało? Z komina unosił się ciemny dym, a wydajność spadła o 5 procent. Przechodnie z zaciekawieniem przyglądali się tej ciężkiej pracy: 'Uwaga na liny!' – krzyknął nagle majster."
splitword=Bananarama.
splitcontext=To jest przykładowe zdanie wprowadzające. Bananarama. Kolejny fragment tekstu pojawia się po krótkiej przerwie.

[pl:gtts]
# speed up generated speech
accelerate=1.7:1.25
# narrow pauses between words
gapAccelerate=0.5:0.6
volume=r8.0

[pl:edge:pl-PL-MarekNeural]
pitch=-10Hz
